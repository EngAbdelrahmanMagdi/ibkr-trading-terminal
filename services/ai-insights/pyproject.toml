[project]
name = "terminal-ai-insights"
version = "0.1.0"
requires-python = ">=3.14,<3.15"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.14"
strict = true

[[tool.mypy.overrides]]
module = ["confluent_kafka.*", "jsonschema.*"]
ignore_missing_imports = true
