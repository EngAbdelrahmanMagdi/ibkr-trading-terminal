name: Security evidence
on:
  workflow_call:
    inputs:
      reuse-images:
        type: boolean
        default: false
    outputs:
      runtime-image-delivery-allowed:
        value: ${{ jobs.security.outputs.runtime-image-delivery-allowed }}
  schedule:
    - cron: '19 7 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      runtime-image-delivery-allowed: ${{ steps.policy.outputs.allowed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download internal runtime images
        if: inputs.reuse-images
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci-runtime-images
          path: .artifacts/build
      - name: Load internal runtime images
        if: inputs.reuse-images
        run: gzip -dc .artifacts/build/runtime-images.tar.gz | docker load
      - name: Build standalone audit images
        if: ${{ !inputs.reuse-images }}
        run: bash infrastructure/ci/build-images.sh
      - name: Select trusted exception baseline
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$BASE_SHA" ]; then
            [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
            mkdir -p .artifacts/security
            git show "$BASE_SHA:security/accepted-findings.json" >.artifacts/security/trusted-baseline.json
            echo 'SECURITY_BASELINE=.artifacts/security/trusted-baseline.json' >>"$GITHUB_ENV"
            git show "$BASE_SHA:infrastructure/ci/security_policy.py" >.artifacts/security/trusted-policy.py
            echo 'SECURITY_POLICY=.artifacts/security/trusted-policy.py' >>"$GITHUB_ENV"
          fi
      - name: Configure advisory cache
        run: |
          mkdir -p .artifacts/trivy-cache
          echo "TRIVY_CACHE=$PWD/.artifacts/trivy-cache" >>"$GITHUB_ENV"
          echo "ADVISORY_DAY=$(date -u +%Y-%m-%d)" >>"$GITHUB_ENV"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: advisories
        with:
          path: .artifacts/trivy-cache
          key: trivy-0.75.0-${{ runner.os }}-${{ runner.arch }}-${{ env.ADVISORY_DAY }}
      - name: Run complete scans and exact exception policy
        id: policy
        run: |
          bash infrastructure/ci/security.sh
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          directory = Path('.artifacts/security/latest-path.txt').read_text().strip()
          allowed = json.loads((Path(directory)/'policy.json').read_text())['runtime_image_delivery_allowed']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('allowed='+str(allowed).lower()+'\n')
          PY
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always() && github.event_name != 'pull_request' && steps.advisories.outputs.cache-hit != 'true'
        with:
          path: .artifacts/trivy-cache
          key: ${{ steps.advisories.outputs.cache-primary-key }}
      - name: Retain complete scanner and policy evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-evidence
          path: .artifacts/security
          if-no-files-found: error
          retention-days: 7
