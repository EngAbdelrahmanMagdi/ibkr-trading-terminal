name: Security review
on:
  schedule:
    - cron: '19 7 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: security-review
  cancel-in-progress: false
jobs:
  security:
    # Same complete scans and policy as pull requests: new, unaccepted or fixable findings and
    # scanner failures still fail this run. Accepted findings due for review do not.
    uses: ./.github/workflows/security.yml
  review:
    needs: security
    if: ${{ !cancelled() && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: security-evidence
          path: .artifacts/security
      - name: Keep one review issue current (edited in place, no comments)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TITLE: Security exception review
        run: |
          report="$(cat .artifacts/security/latest-path.txt 2>/dev/null)/review.md"
          if [ ! -f "$report" ]; then
            echo 'No policy result to review; the security job reports the failure.'
            exit 0
          fi
          issue="$(gh issue list --state open --search "\"$TITLE\" in:title" --json number,title \
            --jq "map(select(.title == env.TITLE)) | first | .number // empty")"
          if [ -s "$report" ]; then
            if [ -n "$issue" ]; then gh issue edit "$issue" --body-file "$report"
            else gh issue create --title "$TITLE" --body-file "$report"; fi
          elif [ -n "$issue" ]; then
            gh issue close "$issue" --reason completed
          fi
