name: Security evidence
on:
  workflow_call:
    inputs:
      reuse-images:
        type: boolean
        default: false
    outputs:
      runtime-image-delivery-allowed:
        value: ${{ jobs.security.outputs.runtime-image-delivery-allowed }}
  schedule:
    - cron: '19 7 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exceptions:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Compare exception policy with the reviewed base branch
        id: compare
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bash infrastructure/ci/exception-changes.sh
  exception-approval:
    # A change cannot approve its own exceptions: changed exception data or policy code
    # is only evaluated after a required reviewer approves this run.
    needs: exceptions
    if: needs.exceptions.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: security-exceptions
    steps:
      - run: echo 'Exception and policy changes approved for this run by a required reviewer.'
  security:
    needs: [exceptions, exception-approval]
    if: ${{ !cancelled() && needs.exceptions.result == 'success' && contains(fromJSON('["success", "skipped"]'), needs.exception-approval.result) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      runtime-image-delivery-allowed: ${{ steps.policy.outputs.allowed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download internal runtime images
        if: inputs.reuse-images
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ci-runtime-images
          path: .artifacts/build
      - name: Load internal runtime images
        if: inputs.reuse-images
        run: gzip -dc .artifacts/build/runtime-images.tar.gz | docker load
      - name: Build standalone audit images
        if: ${{ !inputs.reuse-images }}
        run: bash infrastructure/ci/build-images.sh
      - name: Configure advisory cache
        run: |
          mkdir -p .artifacts/trivy-cache
          echo "TRIVY_CACHE=$PWD/.artifacts/trivy-cache" >>"$GITHUB_ENV"
          echo "ADVISORY_DAY=$(date -u +%Y-%m-%d)" >>"$GITHUB_ENV"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: advisories
        with:
          path: .artifacts/trivy-cache
          key: trivy-0.75.0-${{ runner.os }}-${{ runner.arch }}-${{ env.ADVISORY_DAY }}
      - name: Run complete scans and exact exception policy
        id: policy
        env:
          # The weekly run also fails on accepted findings that are due for review.
          SECURITY_MODE: ${{ github.event_name == 'schedule' && 'monitor' || 'gate' }}
        run: |
          bash infrastructure/ci/security.sh
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          directory = Path('.artifacts/security/latest-path.txt').read_text().strip()
          allowed = json.loads((Path(directory)/'policy.json').read_text())['runtime_image_delivery_allowed']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('allowed='+str(allowed).lower()+'\n')
          PY
      - name: Restore runner ownership of advisory cache
        if: always()
        run: sudo chown -R -- "$(id -u):$(id -g)" "$PWD/.artifacts/trivy-cache"
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always() && github.event_name != 'pull_request' && steps.advisories.outputs.cache-hit != 'true'
        with:
          path: .artifacts/trivy-cache
          key: ${{ steps.advisories.outputs.cache-primary-key }}
      - name: Retain complete scanner and policy evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-evidence
          path: .artifacts/security
          if-no-files-found: error
          retention-days: 7
