# Local development environment for the Real-Time Trading Terminal.
#
# Requires Docker Compose v2.17.0 or newer (the Makefile uses `up --wait --wait-timeout`).
#   make up       core infrastructure: PostgreSQL, Redis, Kafka
#   make up-obs   core infrastructure + observability: Prometheus, Grafana, Tempo, OpenTelemetry Collector
#   make up-mock  the MOCK application: core infrastructure + the realtime gateway (simulated market data)
#                 + Trading Core (orders, positions, portfolio, watchlist against a simulated broker)
#                 + the Next.js web terminal
#   make up-ibkr  the realtime gateway on IBKR market data (local CP Gateway login; infrastructure/ibkr/)
#   make up-ibkr-fake  the IBKR code path against a FAKE CP Gateway (tests; no IBKR account)
#   make load     load/soak clients against the running gateway (after make up-mock)
#
# Every published port is bound to 127.0.0.1. Credentials are Docker secrets generated into ./secrets/
# by `make bootstrap`. Image tags are pinned to exact, verified stable releases.

x-defaults: &defaults
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  # ---------------------------------------------------------------- core infrastructure
  postgres:
    <<: *defaults
    image: trading-terminal/postgres:local
    build: ./infrastructure/postgres
    command:
      - postgres
      - -c
      - timezone=UTC
      - -c
      - log_timezone=UTC
      - -c
      - password_encryption=scram-sha-256
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-trading}
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-trading_admin}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_admin_password
      TRADING_SCHEMA: ${TRADING_SCHEMA:-trading}
      TRADING_OWNER_ROLE: ${TRADING_OWNER_ROLE:-trading_owner}
      TRADING_APP_ROLE: ${TRADING_APP_ROLE:-trading_app}
      TZ: UTC
    secrets:
      - postgres_admin_password
      - trading_owner_password
      - trading_app_password
    volumes:
      # PostgreSQL 18 images use PGDATA=/var/lib/postgresql/18/docker; mount the parent directory.
      - postgres-data:/var/lib/postgresql
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-15432}:5432"
    # The official entrypoint briefly starts as root during initialization to prepare the data directory,
    # then drops privileges to the postgres user; capabilities are limited to what that step needs.
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512m
    networks: [data]

  redis:
    <<: *defaults
    image: trading-terminal/redis:local
    build: ./infrastructure/redis
    user: "999:999"
    command: ["sh", "/usr/local/etc/redis/start-redis.sh"]
    environment:
      REDIS_APP_USER: ${REDIS_APP_USER:-app}
      REDIS_MAXMEMORY: ${REDIS_MAXMEMORY:-256mb}
    secrets:
      - redis_app_password
    volumes:
      - ./infrastructure/redis:/usr/local/etc/redis:ro
    # Disposable state only: no persistence, read-only root filesystem, in-memory scratch space.
    read_only: true
    tmpfs:
      - /tmp:size=1m
      - /data:size=1m
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-16379}:6379"
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$(tr -d '\\r\\n' < /run/secrets/redis_app_password)\" redis-cli --no-auth-warning --user \"$${REDIS_APP_USER}\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 384m
    networks: [data]

  kafka:
    <<: *defaults
    image: trading-terminal/kafka:local
    build: ./infrastructure/kafka
    environment:
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:?KAFKA_CLUSTER_ID is empty - run make bootstrap}
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://127.0.0.1:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://127.0.0.1:${KAFKA_HOST_PORT:-19092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:SSL,EXTERNAL:SSL,CONTROLLER:SSL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      # Topics are provisioned explicitly; producers can never create them implicitly.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms512m -Xmx512m
    entrypoint: ["sh", "/scripts/start-kafka.sh"]
    secrets: [kafka_ca, kafka_broker_keystore]
    volumes:
      - kafka-data:/var/lib/kafka/data
      - ./infrastructure/kafka:/scripts:ro
    ports:
      - "127.0.0.1:${KAFKA_HOST_PORT:-19092}:9092"
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD-SHELL", "KAFKA_HEAP_OPTS=-Xmx64m /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 --command-config /scripts/broker-client.properties > /dev/null 2>&1"]
      interval: 10s
      timeout: 20s
      retries: 12
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 1g
    networks: [data, ai-bus]

  # One-shot topic provisioning (idempotent); the broker never creates topics implicitly.
  kafka-init:
    <<: *defaults
    build:
      context: ./infrastructure/kafka
    image: trading-terminal/kafka-provisioner:local
    restart: "no"
    entrypoint: ["/bin/sh", "/scripts/create-topics.sh"]
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
      KAFKA_HEAP_OPTS: -Xmx128m
    secrets:
      - kafka_ca
      - kafka_operator_keystore
      - source: kafka_broker_keystore
        target: probe_kafka-broker
      - source: kafka_operator_keystore
        target: probe_kafka-operator
      - source: kafka_core_keystore
        target: probe_trading-core
      - source: kafka_gateway_keystore
        target: probe_realtime-gateway
      - source: kafka_ai_keystore
        target: probe_ai-insights
    volumes:
      - ./infrastructure/kafka:/scripts:ro
      - kafka-data:/audit:ro
    depends_on:
      kafka:
        condition: service_healthy
    cap_drop: [ALL]
    deploy:
      resources:
        limits:
          memory: 256m
    networks: [data]

  # ---------------------------------------------------------------- observability (profile)
  prometheus:
    <<: *defaults
    profiles: [observability]
    image: prom/prometheus:v3.13.4
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.retention.size=1GB
    volumes:
      - ./infrastructure/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    read_only: true
    ports:
      - "127.0.0.1:${PROMETHEUS_HOST_PORT:-19090}:9090"
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512m
    networks: [observability, ai-bus]

  otel-collector:
    <<: *defaults
    profiles: [observability]
    image: otel/opentelemetry-collector:0.161.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./infrastructure/observability/otel-collector/config.yaml:/etc/otelcol/config.yaml:ro
    read_only: true
    ports:
      - "127.0.0.1:${OTLP_GRPC_HOST_PORT:-14317}:4317"
      - "127.0.0.1:${OTLP_HTTP_HOST_PORT:-14318}:4318"
    cap_drop: [ALL]
    # Distroless image (no shell): liveness is observed through Prometheus scraping its telemetry endpoint.
    depends_on:
      tempo:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 256m
    networks: [observability]

  tempo:
    <<: *defaults
    profiles: [observability]
    image: grafana/tempo:3.1.0
    command: ["-target=all", "-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./infrastructure/observability/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    read_only: true
    tmpfs:
      - /tmp:size=16m
    ports:
      - "127.0.0.1:${TEMPO_HOST_PORT:-13200}:3200"
    cap_drop: [ALL]
    # Distroless image (no shell): readiness is checked by `make verify` and via Prometheus scraping.
    deploy:
      resources:
        limits:
          memory: 512m
    networks: [observability]

  grafana:
    <<: *defaults
    profiles: [observability]
    image: grafana/grafana:13.2.3
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_LOG_MODE: console
    secrets:
      - grafana_admin_password
    read_only: true
    tmpfs:
      - /tmp:size=32m
    volumes:
      # Mount only the provisioning directories in use so the image's other default folders stay intact.
      - ./infrastructure/observability/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./infrastructure/observability/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./infrastructure/observability/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_HOST_PORT:-13000}:3000"
    cap_drop: [ALL]
    depends_on:
      prometheus:
        condition: service_healthy
      tempo:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512m
    networks: [observability]

  # ---------------------------------------------------------------- application services (profiles)
  realtime-gateway:
    <<: *defaults
    profiles: [gateway]
    build:
      context: ./services/ibkr-realtime-gateway
    image: trading-terminal/realtime-gateway:local
    command: ["serve"]
    environment:
      GATEWAY_HTTP_ADDR: ":8090"
      GATEWAY_HEALTH_ADDR: ":8091"
      # MOCK (default, the only mode for public demos), IBKR or AUTO; IBKR modes are enabled by the
      # override files in infrastructure/ibkr/.
      GATEWAY_MARKET_DATA_MODE: MOCK
      GATEWAY_ALLOWED_ORIGINS: ${GATEWAY_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      GATEWAY_BARS_REQUESTS_PER_MINUTE: ${GATEWAY_BARS_REQUESTS_PER_MINUTE:-120}
      GATEWAY_UPGRADES_PER_MINUTE: ${GATEWAY_UPGRADES_PER_MINUTE:-30}
      GATEWAY_COMMANDS_PER_SECOND: ${GATEWAY_COMMANDS_PER_SECOND:-10}
      GATEWAY_COMMAND_BURST: ${GATEWAY_COMMAND_BURST:-20}
      GATEWAY_SEED: ${GATEWAY_SEED:-20260927}
      GATEWAY_TICK_INTERVAL: ${GATEWAY_TICK_INTERVAL:-1s}
      GATEWAY_HEARTBEAT_INTERVAL: ${GATEWAY_HEARTBEAT_INTERVAL:-15s}
      GATEWAY_SIM_SYNTHETIC_SYMBOLS: ${GATEWAY_SIM_SYNTHETIC_SYMBOLS:-100}
      GATEWAY_MAX_ACTIVE_SYMBOLS: ${GATEWAY_MAX_ACTIVE_SYMBOLS:-150}
      GATEWAY_STALE_AFTER: ${GATEWAY_STALE_AFTER:-5s}
      # Redis holds disposable hot state (latest quotes, bars cache); the gateway keeps working without it.
      GATEWAY_REDIS_ADDR: redis:6379
      # Order notifications: order events from Kafka fanned out as refetch hints (optional; never affects quotes).
      GATEWAY_KAFKA_BROKERS: kafka:29092
      KAFKA_TLS_CA_FILE: /run/secrets/kafka_ca
      KAFKA_TLS_CERT_FILE: /run/secrets/kafka_gateway_cert
      KAFKA_TLS_KEY_FILE: /run/secrets/kafka_gateway_key
      GATEWAY_REDIS_USERNAME: ${REDIS_APP_USER:-app}
      GATEWAY_REDIS_PASSWORD_FILE: /run/secrets/redis_app_password
      GATEWAY_SHUTDOWN_TIMEOUT: 10s
      GATEWAY_LOG_LEVEL: ${GATEWAY_LOG_LEVEL:-info}
    secrets:
      - redis_app_password
      - kafka_ca
      - kafka_gateway_cert
      - kafka_gateway_key
    ports:
      - "127.0.0.1:${GATEWAY_HOST_PORT:-18090}:8090"
      - "127.0.0.1:${GATEWAY_HEALTH_HOST_PORT:-18091}:8091"
    read_only: true
    cap_drop: [ALL]
    # Distroless image (no shell): the binary probes its own readiness endpoint.
    healthcheck:
      test: ["CMD", "/usr/local/bin/realtime-gateway", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    stop_grace_period: 20s
    deploy:
      resources:
        limits:
          memory: 128m
    # Lets the gateway reach a CP Gateway running on the developer's machine (IBKR modes only).
    # edge: clients; data: Redis; observability: Prometheus scrapes /metrics on the internal port.
    networks: [edge, data, observability]

  trading-core:
    <<: *defaults
    profiles: [core]
    build:
      context: ./services/trading-core
      additional_contexts:
        contracts: ./contracts
    image: trading-terminal/trading-core:local
    environment:
      # MOCK: the simulated broker (the only mode for public demos). Fills use the gateway's MOCK quotes.
      APP_RUNTIME_MODE: MOCK
      # Public/demo deployments always use synthetic news and require no provider credential.
      NEWS_PROVIDER: FIXTURE
      NEWS_PRIVATE_DEVELOPMENT: "false"
      NEWS_FRESHNESS: ${NEWS_FRESHNESS:-5m}
      NEWS_WINDOW: ${NEWS_WINDOW:-7d}
      NEWS_QUEUE_CAPACITY: ${NEWS_QUEUE_CAPACITY:-16}
      NEWS_MAX_COLD_REQUESTS: ${NEWS_MAX_COLD_REQUESTS:-4}
      NEWS_WORKERS: ${NEWS_WORKERS:-1}
      NEWS_DEADLINE: ${NEWS_DEADLINE:-8s}
      NEWS_CONNECT_TIMEOUT: ${NEWS_CONNECT_TIMEOUT:-2s}
      NEWS_ATTEMPT_TIMEOUT: ${NEWS_ATTEMPT_TIMEOUT:-3s}
      NEWS_REQUESTS_PER_MINUTE: ${NEWS_REQUESTS_PER_MINUTE:-30}
      NEWS_ATTEMPTS: ${NEWS_ATTEMPTS:-2}
      NEWS_MAX_RESPONSE_BYTES: ${NEWS_MAX_RESPONSE_BYTES:-2097152}
      NEWS_MAX_RECORDS: ${NEWS_MAX_RECORDS:-500}
      NEWS_BREAKER_FAILURES: ${NEWS_BREAKER_FAILURES:-5}
      NEWS_BREAKER_COOLDOWN: ${NEWS_BREAKER_COOLDOWN:-60s}
      NEWS_CLEANUP_INTERVAL: ${NEWS_CLEANUP_INTERVAL:-1h}
      NEWS_MAX_SYMBOLS: ${NEWS_MAX_SYMBOLS:-1000}
      NEWS_RETENTION: ${NEWS_RETENTION:-30d}
      NEWS_MAX_ARTICLES: ${NEWS_MAX_ARTICLES:-50000}
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:-trading}
      DB_APP_USER: ${TRADING_APP_ROLE:-trading_app}
      DB_OWNER_USER: ${TRADING_OWNER_ROLE:-trading_owner}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_USER: ${REDIS_APP_USER:-app}
      APP_CORS_ALLOWED_ORIGINS: ${TRADING_CORE_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      HTTP_ADMISSION_READS: ${HTTP_ADMISSION_READS:-600}
      HTTP_ADMISSION_NEWS: ${HTTP_ADMISSION_NEWS:-60}
      HTTP_ADMISSION_SUBMISSIONS: ${HTTP_ADMISSION_SUBMISSIONS:-60}
      HTTP_ADMISSION_COMMANDS: ${HTTP_ADMISSION_COMMANDS:-120}
      # Domain events are recorded in PostgreSQL and relayed to Kafka; Kafka being down never blocks trading.
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TLS_CA_FILE: /run/secrets/kafka_ca
      KAFKA_TLS_KEYSTORE_FILE: /run/secrets/kafka_core_keystore
    # Read through the config tree under /run/secrets: the migration role's password is used by Flyway only.
    secrets:
      - trading_app_password
      - trading_owner_password
      - redis_app_password
      - kafka_ca
      - kafka_core_keystore
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:${TRADING_CORE_HOST_PORT:-18080}:8080"
      - "127.0.0.1:${TRADING_CORE_MANAGEMENT_HOST_PORT:-18081}:8081"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    # Readiness (PostgreSQL reachable, application started) over plain bash: the image ships no HTTP client.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8081 && printf 'GET /actuator/health/readiness HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 20s
    # Covers request draining and bounded reconciliation, relay and consumer shutdown.
    stop_grace_period: 120s
    deploy:
      resources:
        limits:
          memory: 768m
    # edge: clients; data: PostgreSQL and Redis; observability: Prometheus scrapes the management port.
    networks: [edge, data, observability]

  ai-insights:
    <<: *defaults
    profiles: [ai]
    build:
      context: ./services/ai-insights
      additional_contexts:
        contracts: ./contracts
    image: trading-terminal/ai-insights:local
    environment:
      AI_PROVIDER: FIXTURE
      AI_BROKERS: kafka:29092
      AI_TLS_CA_FILE: /run/secrets/kafka_ca
      AI_TLS_CERT_FILE: /run/secrets/kafka_ai_cert
      AI_TLS_KEY_FILE: /run/secrets/kafka_ai_key
      AI_PRIVATE_DEVELOPMENT: "false"
      AI_DAILY_BUDGET: "0"
      AI_STATE_KEYS: ${AI_STATE_KEYS:-20000}
      AI_STATE_BYTES: ${AI_STATE_BYTES:-67108864}
      AI_STATE_TTL: ${AI_STATE_TTL:-1209600}
      AI_INPUT_BYTES: ${AI_INPUT_BYTES:-16384}
      AI_RESPONSE_BYTES: ${AI_RESPONSE_BYTES:-131072}
      AI_DEADLINE: ${AI_DEADLINE:-30}
    secrets: [kafka_ca, kafka_ai_cert, kafka_ai_key]
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    read_only: true
    cap_drop: [ALL]
    tmpfs: [/tmp:size=16m]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8092/readiness', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
    # Allow bounded reservation/result/final transactions and consumer close to finish.
    stop_grace_period: 420s
    deploy:
      resources:
        limits:
          memory: 512m
    networks: [ai-bus]

  web:
    <<: *defaults
    profiles: [web]
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_CORE_ORIGIN: ${WEB_CORE_ORIGIN:-http://localhost:18080}
        NEXT_PUBLIC_GATEWAY_ORIGIN: ${WEB_GATEWAY_ORIGIN:-http://localhost:18090}
        NEXT_PUBLIC_GATEWAY_WS_URL: ${WEB_GATEWAY_WS_URL:-ws://localhost:18090/ws}
    image: trading-terminal/web:local
    depends_on:
      realtime-gateway:
        condition: service_healthy
      trading-core:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-3000}:3000"
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512m
    networks: [edge]

  playwright:
    profiles: [test]
    image: mcr.microsoft.com/playwright:v1.63.0-noble
    entrypoint: ["sh", "-c"]
    command:
      - "mkdir -p /work && tar -C /src --exclude=node_modules --exclude=.next -cf - . | tar -C /work -xf - && cd /work && npm ci --ignore-scripts --no-audit --no-fund && PLAYWRIGHT_BASE_URL=${PLAYWRIGHT_BASE_URL:-http://localhost:3000} npm run test:e2e"
    volumes:
      - ./apps/web:/src:ro
    network_mode: host

networks:
  data: {}
  edge: {}
  observability: {}
  ai-bus:
    internal: true

volumes:
  postgres-data: {}
  kafka-data: {}
  prometheus-data: {}
  tempo-data: {}
  grafana-data: {}

secrets:
  kafka_ca:
    file: ${KAFKA_SECRET_DIR:-./secrets/kafka}/ca.pem
  kafka_broker_keystore:
    file: ${KAFKA_SECRET_DIR:-./secrets/kafka}/kafka-broker.keystore
  kafka_operator_keystore:
    file: ${KAFKA_SECRET_DIR:-./secrets/kafka}/kafka-operator.keystore
  kafka_core_keystore:
    file: ${KAFKA_SECRET_DIR:-./secrets/kafka}/trading-core.keystore
  kafka_gateway_cert:
    file: ${KAFKA_SECRET_DIR:-./secrets/kafka}/realtime-gateway.pem
  kafka_gateway_key:
    file: ${KAFKA_SECRET_DIR:-./secrets/kafka}/realtime-gateway.key
  kafka_ai_cert:
    file: ${KAFKA_SECRET_DIR:-./secrets/kafka}/ai-insights.pem
  kafka_ai_key:
    file: ${KAFKA_SECRET_DIR:-./secrets/kafka}/ai-insights.key
  kafka_gateway_keystore:
    file: ${KAFKA_SECRET_DIR:-./secrets/kafka}/realtime-gateway.keystore
  kafka_ai_keystore:
