name: Verified artifacts
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  artifacts:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci-runtime-images
          path: .artifacts/build
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: security-evidence
          path: .artifacts/security
      - name: Load internal build inputs
        run: gzip -dc .artifacts/build/runtime-images.tar.gz | docker load
      - name: Package verified source and non-image builds
        env:
          RUNTIME_IMAGE_DELIVERY_ALLOWED: ${{ needs.verify.outputs.runtime-image-delivery-allowed }}
        run: bash infrastructure/ci/delivery.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-build-${{ github.sha }}
          path: .artifacts/delivery
          if-no-files-found: error
          retention-days: 14
