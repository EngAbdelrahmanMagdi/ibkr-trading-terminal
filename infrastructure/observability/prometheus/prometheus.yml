# Prometheus scrape configuration for the local environment.
# Application services add their scrape jobs here as they are introduced.
global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]

  - job_name: tempo
    static_configs:
      - targets: ["tempo:3200"]

  - job_name: grafana
    static_configs:
      - targets: ["grafana:3000"]

  # Present only while the gateway runs (gateway profile); the target is reported down otherwise.
  - job_name: realtime-gateway
    scrape_interval: 5s
    static_configs:
      - targets: ["realtime-gateway:8091"]

  # Present only while Trading Core runs (core profile); the target is reported down otherwise.
  - job_name: trading-core
    scrape_interval: 5s
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["trading-core:8081"]
