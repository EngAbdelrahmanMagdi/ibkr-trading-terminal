# Trading Core configuration. Secrets are read from files (Docker secrets) through the config tree import:
# each file name under SECRETS_DIR becomes a property (trading_app_password, trading_owner_password,
# redis_app_password). No secret has a default value here.
http:
  admission:
    reads: ${HTTP_ADMISSION_READS:600}
    news: ${HTTP_ADMISSION_NEWS:60}
    submissions: ${HTTP_ADMISSION_SUBMISSIONS:60}
    commands: ${HTTP_ADMISSION_COMMANDS:120}

spring:
  application:
    name: trading-core
  config:
    import: "optional:configtree:${SECRETS_DIR:/run/secrets/}"
  main:
    banner-mode: off
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: "jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:15432}/${DB_NAME:trading}?currentSchema=trading&connectTimeout=5&socketTimeout=30&ApplicationName=trading-core"
    username: ${DB_APP_USER:trading_app}
    password: ${trading_app_password:}
    hikari:
      pool-name: trading-core
      maximum-pool-size: 10
      connection-timeout: 3000
      validation-timeout: 2000
  flyway:
    user: ${DB_OWNER_USER:trading_owner}
    password: ${trading_owner_password:}
    schemas: trading
    default-schema: trading
    create-schemas: false
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.default_schema: trading
      hibernate.jdbc.time_zone: UTC
      jakarta.persistence.query.timeout: 5000
  transaction:
    default-timeout: 10s
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:16379}
      username: ${REDIS_USER:app}
      password: ${redis_app_password:}
      timeout: 500ms
      connect-timeout: 1s

server:
  port: 8080
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    whitelabel:
      enabled: false
  tomcat:
    connection-timeout: 5s
    max-connections: 1000
    accept-count: 100
    threads:
      max: 100

management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState,db
  health:
    redis:
      enabled: false
  metrics:
    tags:
      service: trading-core

logging:
  structured:
    json:
      customizer: com.project.trading.shared.config.SecurityLogCustomizer
    format:
      console: ecs

app:
  news:
    provider: ${NEWS_PROVIDER:FIXTURE}
    private-development: ${NEWS_PRIVATE_DEVELOPMENT:false}
    finnhub-api-key: ${finnhub_api_key:}
    freshness: ${NEWS_FRESHNESS:5m}
    window: ${NEWS_WINDOW:7d}
    deadline: ${NEWS_DEADLINE:8s}
    workers: ${NEWS_WORKERS:1}
    queue-capacity: ${NEWS_QUEUE_CAPACITY:16}
    max-cold-requests: ${NEWS_MAX_COLD_REQUESTS:4}
    connect-timeout: ${NEWS_CONNECT_TIMEOUT:2s}
    attempt-timeout: ${NEWS_ATTEMPT_TIMEOUT:3s}
    attempts: ${NEWS_ATTEMPTS:2}
    requests-per-minute: ${NEWS_REQUESTS_PER_MINUTE:30}
    max-response-bytes: ${NEWS_MAX_RESPONSE_BYTES:2097152}
    max-records: ${NEWS_MAX_RECORDS:500}
    max-symbols: ${NEWS_MAX_SYMBOLS:1000}
    retention: ${NEWS_RETENTION:30d}
    max-articles: ${NEWS_MAX_ARTICLES:50000}
    breaker-failures: ${NEWS_BREAKER_FAILURES:5}
    breaker-cooldown: ${NEWS_BREAKER_COOLDOWN:60s}
  runtime-mode: ${APP_RUNTIME_MODE:MOCK}
  # Required for IBKR_PAPER: the deployment is private and trusted (the API has no login).
  trusted-environment: ${APP_TRUSTED_ENVIRONMENT:false}
  account-id: ${APP_ACCOUNT_ID:MOCK-ACCOUNT}
  currency: USD
  orders:
    max-quantity: 10000
    max-notional: 1000000
    quote-max-age: 10s
    max-reply-depth: 3
    shortability-max-age: 1h
    # An application default for how long a broker confirmation request may be answered (verify against the
    # broker); the background sweep adds the grace period, which must exceed the broker request timeout.
    confirmation-ttl: 30s
    confirmation-sweep-grace: 30s
  portfolio:
    starting-cash: 100000.00
  watchlist:
    default-symbols: [NVDA, AAPL, META, AMD, IONQ, MSFT, TSLA, SPY]
    max-items: 200
  queries:
    default-limit: 100
    max-limit: 500
  http:
    cors-allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
    max-request-bytes: 16384
  idempotency:
    in-progress-wait: 2s
    stale-claim-after: 60s
  metrics:
    status-refresh-interval: PT15S
  # Simulated broker (MOCK mode only).
  mock:
    reply-notional-threshold: 50000
    second-reply-notional-threshold: 250000
    reply-ttl: 5m
    max-pending-replies: 100
    matcher-interval: 1s
    matcher-batch-size: 200
    max-open-orders: 1000
    not-ready-timeout: 2m
    commission-per-share: 0.005
    commission-minimum: 1.00
    reject-symbols: []
    shortability:
      IONQ: NOT_SHORTABLE
      TSLA: UNAVAILABLE
  # IBKR Client Portal Gateway (IBKR_PAPER mode only). The allocation is this service's share of the session
  # request limit: realtime gateway allocation + this allocation + headroom must not exceed the limit.
  ibkr:
    base-url: ${APP_IBKR_BASE_URL:https://host.docker.internal:5000/v1/api}
    ca-file: ${APP_IBKR_CA_FILE:/run/secrets/ibkr_ca}
    connect-timeout: 3s
    request-timeout: 10s
    max-response-bytes: 4194304
    session-limit: ${APP_IBKR_SESSION_LIMIT:10}
    allocation: ${APP_IBKR_ALLOCATION:4}
    headroom: ${APP_IBKR_HEADROOM:1}
    limiter-queue: 32
    limiter-timeout: 5s
    penalty-cooldown: 15m
    readiness-ttl: 5s
    order-lock-timeout: 5s
    shortability-ttl: 60s
    account-ttl: 10s
  # Transactional outbox relay to Kafka. Events are always recorded with the state change; the relay publishes them.
  outbox:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:19092}
    publisher-enabled: ${APP_OUTBOX_PUBLISHER_ENABLED:true}
    batch-size: 100
    poll-interval: 500ms
    lease: 60s
    max-attempts: 10
    record-backoff-base: 5s
    record-backoff-max: 10m
    outage-backoff-base: 1s
    outage-backoff-max: 60s
    request-timeout: 5s
    delivery-timeout: 15s
    max-block: 5s
    retention: 7d
    purge-interval: 1h
    purge-batch-size: 1000
    purge-max-batches: 20
  # Idempotent consumers: processed event IDs are kept longer than the topics' retention.
  inbox:
    retention: 14d
    purge-interval: 6h
  # Reconciliation with broker truth (runs only where the broker supports it).
  reconciliation:
    interval: 30s
    min-spacing: 10s
    initial-delay: 10s
    unknown-order-alert-after: 15m
  # Broker order updates from the realtime gateway (IBKR_PAPER only).
  broker-updates:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:19092}
    topic: broker.order-updates.v1
    group: trading-core-broker-updates
    max-poll-records: 100
    not-ready-attempts: 5
    not-ready-max-wait: 30s
