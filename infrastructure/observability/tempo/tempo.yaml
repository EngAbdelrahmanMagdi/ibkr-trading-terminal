# Grafana Tempo 3.x, single-binary mode (-target=all) with local storage.
# Receives OTLP traces from the OpenTelemetry Collector on the private Compose network.
stream_over_http_enabled: true

server:
  http_listen_port: 3200
  log_level: info

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317

storage:
  trace:
    backend: local
    # Keep the existing storage format explicit across runtime updates.
    block:
      version: vParquet4
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

usage_report:
  reporting_enabled: false
