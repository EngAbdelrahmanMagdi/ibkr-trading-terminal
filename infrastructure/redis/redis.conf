# Redis configuration for disposable hot state and caches.
# Redis is never a source of truth: nothing here may be required to survive a restart.

bind * -::*
port 6379
protected-mode yes

# ---- No persistence ----
save ""
appendonly no
dir /data

# ---- Bounded memory ----
# maxmemory is passed on the command line (REDIS_MAXMEMORY). Every application key must carry a
# TTL, so eviction is restricted to keys with an expiry.
maxmemory-policy volatile-lru
maxclients 1000

# ---- Connections ----
timeout 0
tcp-keepalive 300

loglevel notice
logfile ""
