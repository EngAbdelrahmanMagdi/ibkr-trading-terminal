<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" role="img" aria-labelledby="title desc"><title id="title">MarketPulse service architecture</title><desc id="desc">Browser REST to Core and REST/WebSocket to Gateway. Core owns PostgreSQL. Core and Gateway use Redis. Core, Gateway and isolated AI exchange events through Kafka.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0l10 5-10 5" fill="#56d6bb"/></marker></defs><g fill="#1b2532" stroke="#39485b"><rect x="30" y="130" width="160" height="65" rx="4"/><rect x="280" y="35" width="175" height="65" rx="4"/><rect x="280" y="225" width="175" height="65" rx="4"/><rect x="590" y="20" width="145" height="55" rx="4"/><rect x="590" y="260" width="145" height="50" rx="4"/><rect x="590" y="135" width="145" height="60" rx="4"/><rect x="825" y="135" width="150" height="60" rx="4"/></g><g fill="none" stroke="#56d6bb" stroke-width="1.5" marker-end="url(#arrow)"><path d="M190 145L280 75"/><path d="M190 180L280 245"/><path d="M455 55L590 48"/><path d="M455 80L590 155"/><path d="M455 245L590 185"/><path d="M455 265L590 285"/><path d="M455 95L590 270"/><path d="M825 165L735 165"/></g><g fill="#e5ebf3" font-family="Arial, sans-serif" font-size="15" text-anchor="middle"><text x="110" y="158">Browser terminal</text><text x="110" y="179" font-size="11" fill="#a0adbe">Next.js / React</text><text x="368" y="63">Trading Core</text><text x="368" y="84" font-size="11" fill="#a0adbe">Java / Spring</text><text x="368" y="253">Realtime Gateway</text><text x="368" y="274" font-size="11" fill="#a0adbe">Go</text><text x="662" y="53">PostgreSQL</text><text x="662" y="286">Redis cache</text><text x="662" y="161">Kafka mTLS</text><text x="662" y="182" font-size="11" fill="#a0adbe">service ACLs / events</text><text x="900" y="161">AI worker</text><text x="900" y="182" font-size="11" fill="#a0adbe">isolated / Python</text><text x="230" y="100" font-size="11" fill="#a0adbe">REST</text><text x="224" y="237" font-size="11" fill="#a0adbe">REST / WS</text></g></svg>
