version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
    open-pull-requests-limit: 3
  - package-ecosystem: npm
    directory: /apps/web
    schedule: {interval: weekly}
    open-pull-requests-limit: 3
    ignore:
      # Node.js types follow the pinned Node 24 LTS runtime (engines >=24 <25).
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
  - package-ecosystem: maven
    directory: /services/trading-core
    schedule: {interval: weekly}
    open-pull-requests-limit: 3
  - package-ecosystem: gomod
    directory: /services/ibkr-realtime-gateway
    schedule: {interval: weekly}
    open-pull-requests-limit: 3
  - package-ecosystem: pip
    directory: /services/ai-insights
    schedule: {interval: weekly}
    open-pull-requests-limit: 3
  - package-ecosystem: docker
    directories:
      - /apps/web
      - /services/trading-core
      - /services/ibkr-realtime-gateway
      - /services/ai-insights
      - /infrastructure/kafka
      - /infrastructure/postgres
      - /infrastructure/redis
    schedule: {interval: weekly}
    open-pull-requests-limit: 3
    ignore:
      # Java images stay on the current LTS line; non-LTS feature releases are skipped.
      - dependency-name: eclipse-temurin
        update-types: [version-update:semver-major]
